submission:
  title: "Missing Person Investigation AI Assistant"               

  problem_statement: >
    India records over 80,000 missing children each year (NCRB 2022), and the first 24 hours
    are the most critical for recovery. Families lose precious time repeating the same details
    across paperwork, while investigators have no correlated view of tips, CCTV sightings, and
    social media signals, so promising leads get buried or acted on too late.

  solution_summary: >
    We built a Bob-powered case coordination tool that collects a family's details once and
    correlates them with investigator tip logs and CCTV sighting descriptions. It generates a
    prioritized list of leads with reasons and recommended next actions, then drafts a public
    appeal notice and auto-fills a police missing person case file for human review.

  key_features: 
    - "Centralized case management: family details are entered once and reused to auto-fill the police missing person case file and the public appeal notice, alongside person profiles, case status and investigation details."
    - "Sighting, tip and evidence management with locations, descriptions and supporting information from tip logs and CCTV sightings."
    - "AI-assisted analysis that correlates sources, surfaces potential matches and generates prioritized investigative leads with recommended next actions for human review."
    - "Investigation timeline, map visualization and case intelligence that show movement patterns and how each lead was ranked."
    - "Role-based access, investigator alerts and audit logging for secure handling of sensitive case data."

   tech_stack:
    languages: ["HTML5", "CSS3", "JavaScript"]                     
    frameworks: ["Tailwind CSS v3 (CDN)", "Leaflet.js v1.9.4"]                   
    ibm_technologies: ["IBM BOB"]            
    databases: [""]                  
    other: ["OpenStreetMap (map data)", "OpenStreetMap (map data)", "Web Clipboard API (navigator.clipboard)", "Browser Print API (window.print)"]                     

  known_limitations: 
    - "AI-assisted results are potential leads and require human investigator review."
    - "Demonstration cases, people, sightings and evidence use fictional data."
    - "IBM AI/watsonx integration may require appropriate configuration and credentials."
    - "The prototype may require additional security, privacy, legal and infrastructure controls for production deployment."
